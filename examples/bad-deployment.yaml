apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  template:
    spec:
      hostPID: true
      hostNetwork: true
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
      containers:
        - name: api
          image: internal/payments-api:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add: [SYS_ADMIN]
