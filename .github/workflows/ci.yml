name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: opa check --strict
        run: opa check policies --strict

      - name: opa test
        run: opa test policies -v

      - name: The catalogue is sound
        # Every policy must have a title, description, remediation, severity,
        # at least one framework mapping, and a test file beside it.
        run: pach validate

      - name: The deliberately bad manifest is denied
        run: |
          if pach eval examples/bad-deployment.yaml; then
            echo "::error::the bad manifest was not denied"
            exit 1
          fi
          echo "denied as expected"

      - name: The hardened manifest passes
        run: pach eval examples/good-deployment.yaml

      - run: pytest -q

      - name: Build the distributable bundle
        run: pach bundle --out dist/policies.tar.gz --revision "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: policy-bundle
          path: dist/policies.tar.gz
